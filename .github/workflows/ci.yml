name: Policy Assistant CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r policy_assistant/requirements.txt -r tests/requirements.txt
      - uses: aws-actions/setup-sam@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: SAM build
        run: sam build --template-file template.yaml
      - name: Unit tests
        run: python -m pytest tests -v --tb=short
      - name: Frontend workflow checks
        run: npm test --prefix frontend
      - name: SAM validate
        run: sam validate --lint --region ap-southeast-1
      - name: Check source handover integrity
        run: |
          python scripts/source_bundle.py create --output .deployment/ci-source.zip
          python scripts/source_bundle.py verify --archive .deployment/ci-source.zip
